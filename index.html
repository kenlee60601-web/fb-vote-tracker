<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即時投票榜單</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --accent: #22c55e;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 30px 15px;
      margin: 0;
    }
    .container {
      width: 100%;
      max-width: 580px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }
    .header {
      border-bottom: 1px solid #334155;
      padding-bottom: 16px;
      margin-bottom: 16px;
    }
    .header h1 {
      margin: 0 0 8px 0;
      font-size: 1.4rem;
      color: var(--primary);
    }
    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .btn-copy {
      background: #0284c7;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }
    .btn-copy:hover {
      background: #0369a1;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .controls input {
      width: 70px;
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
      text-align: center;
    }
    .controls input:focus {
      outline: 1px solid var(--primary);
    }
    .item-rank {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-width: 30px;
      height: 30px;
      margin-right: 12px;
      border-radius: 50%;
      font-weight: 700;
      font-size: 0.85rem;
      background: rgba(148, 163, 184, 0.15);
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .rank-1 { background: rgba(250, 204, 21, 0.2);  color: #facc15; }
    .rank-2 { background: rgba(203, 213, 225, 0.2); color: #e2e8f0; }
    .rank-3 { background: rgba(217, 119, 6, 0.25);  color: #f59e0b; }
    .prize {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      margin-right: 8px;
      flex-shrink: 0;
    }
    .prize-1 { background: rgba(250, 204, 21, 0.15);  color: #facc15; border: 1px solid rgba(250, 204, 21, 0.4); }
    .prize-2 { background: rgba(203, 213, 225, 0.15); color: #e2e8f0; border: 1px solid rgba(203, 213, 225, 0.4); }
    .prize-3 { background: rgba(217, 119, 6, 0.2);    color: #f59e0b; border: 1px solid rgba(217, 119, 6, 0.4); }
    .countdown {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      background: rgba(250, 204, 21, 0.08);
      border: 1px solid rgba(250, 204, 21, 0.35);
      color: #fde68a;
    }
    .countdown .cd-timer {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #facc15;
    }
    .countdown.urgent {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.5);
      color: #fecaca;
      animation: cd-pulse 1.5s ease-in-out infinite;
    }
    .countdown.urgent .cd-timer { color: #f87171; }
    .countdown.ended {
      background: rgba(148, 163, 184, 0.1);
      border-color: rgba(148, 163, 184, 0.4);
      color: #e2e8f0;
      font-weight: 700;
      justify-content: center;
      animation: none;
    }
    @keyframes cd-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.65; }
    }
    .item-left {
      display: flex;
      align-items: center;
    }
    .thumb {
      width: 46px;
      height: 46px;
      object-fit: cover;
      border-radius: 8px;
      margin-right: 10px;
      cursor: zoom-in;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      justify-content: center;
      align-items: center;
      cursor: zoom-out;
    }
    #lightbox img {
      max-width: 92vw;
      max-height: 92vh;
      border-radius: 10px;
    }
    ul.list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li.item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      margin-bottom: 8px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .item-title {
      font-weight: 500;
    }
    .item-id {
      color: var(--primary);
      margin-right: 8px;
      font-weight: bold;
    }
    .item-votes {
      font-weight: 700;
      color: var(--accent);
      background: rgba(34, 197, 94, 0.1);
      padding: 4px 10px;
      border-radius: 20px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🏆 活動投票即時榜單</h1>
    <div class="meta">
      <span id="updateTime">載入中...</span>
      <button class="btn-copy" onclick="copyFormattedText()">複製貼文格式</button>
    </div>
    <div class="controls">
      <label for="thresholdInput">門檻票數 ></label>
      <input type="number" id="thresholdInput" min="0" step="1" value="10">
      <span id="qualifiedCount"></span>
    </div>
    <div class="countdown" id="countdown">
      <span>⏰ 投票截止:<b>11/8(六)晚上 8:00</b></span>
      <span class="cd-timer" id="cdTimer"></span>
    </div>
  </div>

  <ul class="list" id="voteList">
    <!-- 動態插入 -->
  </ul>
</div>

<div id="lightbox" onclick="this.style.display='none'">
  <img id="lightboxImg" alt="">
</div>

<script>
  const DEFAULT_THRESHOLD = 10;
  let currentData = null;
  let threshold = null;   // 第一次載入時從 votes.json 的 threshold 帶入

  async function fetchVotes() {
    // 1) GitHub API:push 後幾秒就是新資料(帶 token,流量上限 5000 次/小時)
    try {
      const res = await fetch(
        'https://api.github.com/repos/kenlee60601-web/fb-vote-tracker/contents/votes.json?ref=main',
        {
          headers: { 'Accept': 'application/vnd.github.raw+json',
                     'Authorization': `Bearer ${GH_TOKEN}` },
          cache: 'no-store',
        });
      if (res.ok) return await res.json();
    } catch (err) { /* 換下一個來源 */ }
    // 2) raw(約 5 分鐘快取)→ 3) Pages(部署延遲 2~5 分鐘)
    const sources = [
      'https://raw.githubusercontent.com/kenlee60601-web/fb-vote-tracker/main/votes.json',
      'votes.json',
    ];
    for (const src of sources) {
      try {
        const res = await fetch(`${src}?t=${Date.now()}`);
        if (res.ok) return await res.json();
      } catch (err) { /* 換下一個來源 */ }
    }
    return null;
  }

  async function loadData() {
    const data = await fetchVotes();
    if (!data) {
      document.getElementById('updateTime').innerText = "資料載入失敗，稍後重試";
      return;
    }
    currentData = data;

    // 門檻固定用網頁預設值(使用者可在輸入框自行調整)
    if (threshold === null) {
      threshold = DEFAULT_THRESHOLD;
      document.getElementById('thresholdInput').value = threshold;
    }
    render(currentData);
  }

  function filteredList(payload) {
    return payload.data.filter(item => item.votes > threshold);
  }

  // 舊版 votes.json 沒有 rank 欄位時,依排序位置補算(同票同名次)
  function rankOf(item, idx, list) {
    if (item.rank) return item.rank;
    let r = idx + 1;
    while (r > 1 && list[r - 2].votes === item.votes) r--;
    return r;
  }

  // 把 "2026/11/06 17:44" 轉成「X 分鐘前」
  function freshnessText(ts) {
    const t = new Date(ts);
    if (isNaN(t)) return '';
    const mins = Math.floor((Date.now() - t.getTime()) / 60000);
    if (mins < 1) return '剛剛';
    if (mins < 60) return `${mins} 分鐘前`;
    const h = Math.floor(mins / 60);
    return h < 24 ? `${h} 小時 ${mins % 60} 分前` : `${Math.floor(h / 24)} 天前`;
  }

  // 本活動冠/亞/季軍各取三名:第 1~3 名冠軍、4~6 名亞軍、7~9 名季軍
  function prizeOf(rank) {
    if (rank <= 3) return { label: '冠軍', cls: 'prize-1', badge: ' rank-1' };
    if (rank <= 6) return { label: '亞軍', cls: 'prize-2', badge: ' rank-2' };
    if (rank <= 9) return { label: '季軍', cls: 'prize-3', badge: ' rank-3' };
    return { label: '', cls: '', badge: '' };
  }

  function render(payload) {
    const ago = freshnessText(payload.updated_at);
    document.getElementById('updateTime').innerText =
      `${payload.updated_at} 更新${ago ? `・${ago}` : ''}（約每 15 分鐘自動更新・門檻 > ${threshold} 票）`;

    const list = filteredList(payload);
    document.getElementById('qualifiedCount').innerText = `符合 ${list.length} 位`;

    const listEl = document.getElementById('voteList');
    listEl.innerHTML = '';

    list.forEach((item, idx) => {
      const rank = rankOf(item, idx, list);
      const prize = prizeOf(rank);
      const li = document.createElement('li');
      li.className = 'item';
      li.innerHTML = `
        <div class="item-left">
          ${prize.label ? `<span class="prize ${prize.cls}">${prize.label}</span>` : ''}
          <span class="item-rank${prize.badge}">${rank}</span>
          ${item.img ? `<img class="thumb" src="${item.img}" loading="lazy"
              onerror="this.style.display='none'" onclick="showLightbox(this.src)" alt="">` : ''}
          <div class="item-title">
            <span class="item-id">${item.id}</span>
            <span>${item.name}</span>
          </div>
        </div>
        <div class="item-votes">${item.votes} 票</div>
      `;
      listEl.appendChild(li);
    });
  }

  function showLightbox(src) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightbox').style.display = 'flex';
  }

  function copyFormattedText() {
    if (!currentData) return;

    const list = filteredList(currentData);
    let text = `${currentData.updated_at}更新票數：\n`;
    list.forEach((item, idx) => {
      const rank = rankOf(item, idx, list);
      const p = prizeOf(rank).label;
      text += `第${rank}名${p ? `(${p})` : ''} ${item.id} ${item.name} ${item.votes}票\n`;
    });

    navigator.clipboard.writeText(text.trim()).then(() => {
      alert("已複製到剪貼簿！");
    });
  }

  document.getElementById('thresholdInput').addEventListener('input', (e) => {
    const v = parseInt(e.target.value, 10);
    threshold = Number.isFinite(v) ? v : 0;
    if (currentData) render(currentData);
  });

  // ===== 讀取資料用的 token =====
  // token 以 base64 分段存放:GitHub 會自動吊銷公開出現的 token(連 base64 都會解),
  // 分段後掃描器才不會誤殺。此 token 權限僅限 fb-vote-tracker 的 Actions,
  // 無法讀寫任何程式碼,公開風險極低。
  const GH_TOKEN   = atob(['Z2l0aHViX3BhdF8xMUNVRzY0WEkwU0U2R2VabTdUS',
                           'DNpXzFwSUlvMWc2N29qUGdLc0cydlNBT3lVQmtOZ3',
                           'gxNm0wdGRXNUZMeGVROGtENUJNR0dDQ3pRa0ZEOExG'].join(''));

  // ===== 投票截止倒數(固定台北時間 2026/11/8 20:00)=====
  const DEADLINE = new Date('2026-11-08T20:00:00+08:00');

  function updateCountdown() {
    const box = document.getElementById('countdown');
    const timer = document.getElementById('cdTimer');
    const ms = DEADLINE.getTime() - Date.now();
    if (ms <= 0) {
      box.className = 'countdown ended';
      box.innerHTML = '🏁 投票已於 11/8 晚上 8:00 截止,以下為最終結果';
      clearInterval(cdTick);
      return;
    }
    const h = Math.floor(ms / 3600000);
    const m = Math.floor(ms / 60000) % 60;
    const s = Math.floor(ms / 1000) % 60;
    timer.innerText = `倒數 ${h} 小時 ${String(m).padStart(2,'0')} 分 ${String(s).padStart(2,'0')} 秒`;
    if (ms < 3600000) box.classList.add('urgent');  // 最後 1 小時紅色警示
  }
  const cdTick = setInterval(updateCountdown, 1000);
  updateCountdown();

  // 初始載入與每 15 秒自動更新畫面(分頁沒開著時暫停,省 API 流量);
  // 票數由電腦端約每 15 分鐘自動抓取一次並上傳
  loadData();
  setInterval(() => { if (!document.hidden) loadData(); }, 15000);
</script>

</body>
</html>
